[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runapi-heygen-video"
version = "0.1.0"
description = "RunAPI HeyGen Video SDK for text-to-video, reference-guided, and image-to-video workflows with generated sound in JavaScript, Python, Ruby, Go, Java, and PHP"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "RunAPI", email = "contact@runapi.ai" }]
keywords = ["runapi", "runapi-ai", "heygen-video", "api", "sdk", "typescript", "python", "ruby", "golang", "java", "maven", "gradle", "video-generation", "text-to-video", "image-to-video"]
dependencies = ["runapi-core~=0.10.1"]

[project.urls]
Homepage = "https://runapi.ai/models/heygen-video"
Documentation = "https://runapi.ai/docs/resources/sdks"
Source = "https://github.com/runapi-ai/heygen-video-sdk"
Issues = "https://github.com/runapi-ai/heygen-video-sdk/issues"
Changelog = "https://github.com/runapi-ai/heygen-video-sdk/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/runapi-ai/heygen-video-sdk/releases/tag/python%2Fv0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/runapi"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.runapi]
slug = "heygen-video"
